[project]
name = "quantitive-prop"
version = "0.0.1"
description = "Конвейер поиска стратегий и ботов для CFD-пропов"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.12,<1",
]

[project.scripts]
pbl = "pbl.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbl"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]
ignore = [
    "RUF001",  # кириллица в строках — норма для проекта
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --strict-markers"
filterwarnings = ["error"]

[[tool.mypy.overrides]]
module = ["numba", "numba.*"]
ignore_missing_imports = true
