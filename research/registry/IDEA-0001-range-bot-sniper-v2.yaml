assumptions:
- >-
  Правил входа оригинала у нас нет: известны только RR 1:1, торговля диапазона и фильтр дня (Пн лонг,
  Ср лонг, Чт шорт, Вт и Пт оба). Окна диапазонов — стартовая сетка, не копия бота.
- >-
  Фильтр дня недели гоняем в двух видах — по автору и без него (оба в счётчик вариантов). Корзины для
  проверки OOS: «разрешённые» = Пн лонг, Вт оба, Ср лонг, Чт шорт, Пт оба; «запрещённые» = Пн шорт, Ср
  шорт, Чт лонг. Корзины пулим по инструментам и сессиям.
- >-
  Каждую сторону симулируем независимо (long-only, short-only), чтобы корзина «день × направление» не
  зависела от того, какая сторона сработала первой; OCO «обе стороны» — отдельный вариант.
- >-
  Вердикт по фильтру: блочный бутстрэп по дням даёт 90% интервал разности mean R (разрешённые − запрещённые)
  на OOS; интервал накрывает 0 — «не доказано», фильтр снимаем (VALIDATION §4.5, P-06). Мощность: OOS
  30% от 5 лет ≈ 78 недель, «разрешённых» side-days ≈ 7 в неделю (≈ 550), «запрещённых» ≈ 3 в неделю (≈
  230); при σ(R) ≈ 1 SE разности ≈ 0.08R для одной связки инструмент × сессия. Индексы в один день сильно
  коррелированы, поэтому пулинг по ним мощность почти не добавляет; эффект < 0.15R мы не различим. На
  3 месяцах вердикта по фильтру нет в принципе.
- >-
  Заявленные автором 73% на 138 сделках: 95% интервал Уилсона ≈ 65–80%; фильтр дня подобран на той же
  выборке. Ориентир, а не цель. Безубыточный винрейт при RR 1:1 = 50% + издержки.
- >-
  Границы сессий якорим к ET (сервер FN = ET + 7 ч круглый год, D-019). Лондон в ET смещается относительно
  лондонского времени 2–3 недели в год (разные даты перехода) — вариант по лондонскому времени идёт в
  мутации.
- Не больше 1 сделки на инструмент в день (как у оригинала); вариант — 2.
- >-
  Фильтр ширины диапазона относительно ATR отсекает узкие диапазоны с дорогим спредом и короткими сделками;
  полосу выбираем на IS, перебор идёт в счётчик.
- >-
  Новостной фильтр обязателен: открытие NY совпадает с новостями 08:30 и 10:00 ET. Удержание ≥ 30 с (цель
  ≥ 2 мин), открытый риск ≤ 3% B0, ≤ 200 сделок в день (D-004).
- >-
  Размер сетки до мутаций ≈ 4 инструмента × 5 окон × 2 семейства × 7 выходов × 2 фильтра = 560 проб; N
  для DSR — по счётчику (research/registry/variants/IDEA-0001.parquet). При таком N DSR ≥ 0.95 жёсткий;
  PBO ≤ 0.2 — альтернативный путь (VALIDATION §4.3).
- >-
  Данные: Dukascopy USATECHIDXUSD, USA30IDXUSD, USA500IDXUSD, DEUIDXEUR; спред по часам из configs/instruments;
  спред FN в MT5 не измерен (O-04), берём худший из двух, когда он будет. S1 требует ≥ 200 сделок и сплит
  70/30: на 3 месяцах NAS100 это не больше 66 сделок на вариант (по одной в день) — такие прогоны только
  для отладки движка, решений по ним нет. Решения — после загрузки 5+ лет (T8).
