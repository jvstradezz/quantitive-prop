entry: >-
  Диапазон = [low, high] окна сессии (список sessions). Два семейства. (а) Пробой: после закрытия окна
  стоп-ордера buy stop = high + buffer и sell stop = low − buffer (OCO), buffer ∈ {0, 0.05, 0.1} × ширины;
  сработал один — второй снимается. (б) Возврат: бар закрывается за границей и следующий бар закрывается
  обратно внутри диапазона — вход рыночным в сторону диапазона. Ордера живут до закрытия NY (16:00 ET),
  вариант — снять через 2 часа после окна; не больше 1 сделки на инструмент в день.
stop: >-
  (а) противоположная граница диапазона (стоп = ширина + buffer); (б) за экстремумом ложного пробоя. Стоп
  у брокера всегда (SPEC B3).
take: >-
  База — 1 × стоп (как у оригинала). Варианты: 2 × и 3 × стопа; для (б) — противоположная граница диапазона.
exits:
- rr_1_1
- rr_1_2
- rr_1_3
- trailing
- partial
