id: IDEA-0001
title: Range bot по мотивам Sniper Range Bot V2
status: Формализована
created: 2026-10-28
author: Nikita
source:
  channel: chat
  ref: сообщение Nikita в чате проекта, 2026-10-28
  attachments: []
summary: >-
  Чужой бот (Sniper Range Bot V2) на фьючерсе NQ торгует диапазон; стоп и тейк 1:1, направление задано
  днём недели. Его отчёт: 138 сделок, винрейт 73%, MC на $50K eval (цель +$3 000, EOD-трейлинг $2 000)
  — 93% прохождения. Мы не копируем бота (правил входа у нас нет), а проверяем семейство «диапазон сессии»
  на индексных CFD FundedNext и главный вопрос идеи: держится ли фильтр дня недели на OOS.
markets:
  asset_classes:
  - index_cfd
  instruments:
